  <style>
    html,
    body,
    #root {
      height: 100%;
      min-height: 100%;
      touch-action: pan-x pan-y;
    }

    body {
      margin: 0;
      background: #fff;
    }

    #root {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: 100dvh;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
    }

    #root>div {
      flex: 1;
      width: 100%;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      min-height: 0;
    }

    .reedle-web-slider {
      -webkit-appearance: none;
      appearance: none;
      height: 6px !important;
      border: 0;
      border-radius: 4px;
      outline: none;
    }

    .reedle-web-slider::-webkit-slider-runnable-track {
      height: 6px;
      border: 0;
      border-radius: 4px;
      background: transparent;
    }

    .reedle-web-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      margin-top: -6px;
      border: 0;
      border-radius: 50%;
      background: var(--reedle-slider-color, #fe4444);
      cursor: pointer;
    }

    .reedle-web-slider::-moz-range-track {
      height: 6px;
      border: 0;
      border-radius: 4px;
      background: transparent;
    }

    .reedle-web-slider::-moz-range-progress {
      height: 6px;
      border-radius: 4px;
      background: var(--reedle-slider-color, #fe4444);
    }

    .reedle-web-slider::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border: 0;
      border-radius: 50%;
      background: var(--reedle-slider-color, #fe4444);
      cursor: pointer;
    }
  </style>
